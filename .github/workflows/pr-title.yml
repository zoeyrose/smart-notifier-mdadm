name: PR title validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Conventional Commit format
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const conventional = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()\r\n]+\))?!?: \S.*$/;
            if (/[\r\n]/.test(title) || !conventional.test(title)) {
              core.setFailed('Use a Conventional Commit title, such as "fix(config): preserve comments".');
            }

